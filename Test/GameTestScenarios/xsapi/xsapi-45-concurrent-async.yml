id: XSAPI-45-Concurrent-Async
name: XSAPI 45 - Concurrent Async Operations
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Fires multiple async operations sequentially (profile, presence,
  achievements) and verifies all complete independently.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblProfileGetUserProfileAsync
    - command: XblPresenceSetPresenceAsync
    - command: XblPresenceGetPresenceAsync
    - command: XblPresenceRecordGetXuid
    - command: XblPresenceRecordGetUserState
    - command: XblPresenceRecordCloseHandle
    - command: XblAchievementsGetAchievementsForTitleIdAsync
    - command: XblAchievementsResultGetAchievements
    - command: XblAchievementsResultCloseHandle
    - command: XblEventsWriteInGameEvent

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
