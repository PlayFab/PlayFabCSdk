id: XSAPI-03-Presence
name: XSAPI 03 - Presence Set and Get
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer presence/presence.lua.
  Signs in, sets presence, reads it back, inspects the record fields,
  then queries presence for a social group and for multiple users.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  presence-flow:
    # Set then get presence
    - command: XblPresenceSetPresenceAsync
    - command: XblPresenceGetPresenceAsync
    # Inspect the record
    - command: XblPresenceRecordGetXuid
    - command: XblPresenceRecordGetUserState
    - command: XblPresenceRecordGetDeviceRecords
    - command: XblPresenceRecordCloseHandle
    # Query social group and multiple users
    - command: XblPresenceGetPresenceForSocialGroupAsync
    - command: XblPresenceGetPresenceForMultipleUsersAsync

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: presence-flow

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
