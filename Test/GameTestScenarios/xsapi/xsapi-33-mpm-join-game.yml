id: XSAPI-33-MPM-Join-Game
name: XSAPI 33 - Multiplayer Manager Join Game from Lobby
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer multiplayerManager/MPM_SingleDevice_JoinLeaveGame.lua.
  After lobby setup, joins a game session from lobby, inspects game
  session properties, then leaves the game.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblMultiplayerManagerInitialize
    - command: XblMultiplayerManagerLobbySessionAddLocalUser
    - command: XblMultiplayerManagerLobbySessionSetLocalMemberConnectionAddress
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerJoinGameFromLobby
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerGameSessionActive
    - command: XblMultiplayerManagerGameSessionCorrelationId
    - command: XblMultiplayerManagerGameSessionMembers
    - command: XblMultiplayerManagerGameSessionConstants
    - command: XblMultiplayerManagerGameSessionSessionReference
    - command: XblMultiplayerManagerLeaveGame
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerLobbySessionRemoveLocalUser
    - command: XblMultiplayerManagerDoWork

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
