id: XSAPI-11-Achievements-Update
name: XSAPI 11 - Update Achievement Progress
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer achievements/update-achievements.lua.
  Signs in, creates XBL context, and updates achievement progress.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblAchievementsUpdateAchievementAsync

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
