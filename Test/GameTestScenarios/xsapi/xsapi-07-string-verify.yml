id: XSAPI-07-StringVerify
name: XSAPI 07 - String Verification
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer stringVerify/stringVerify.lua.
  Signs in, creates XBL context, verifies a single string,
  then verifies multiple strings.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  string-verify:
    - command: XblStringVerifyStringAsync
    - command: XblStringVerifyStringsAsync

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: string-verify

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
