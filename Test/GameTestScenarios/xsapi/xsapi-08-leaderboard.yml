id: XSAPI-08-Leaderboard
name: XSAPI 08 - Leaderboard Query
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer leaderboard/leaderboard.lua.
  Signs in, creates XBL context, queries a leaderboard,
  checks pagination, and verifies result access.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  leaderboard-flow:
    - command: XblLeaderboardGetLeaderboardAsync
      parameters:
        leaderboardName: "TotalPuzzlesSolvedLB"

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: leaderboard-flow

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
