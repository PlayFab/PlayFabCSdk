id: XSAPI-32-MPM-Lobby-Lifecycle
name: XSAPI 32 - Multiplayer Manager Lobby Lifecycle
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer multiplayerManager/MPM_SingleDevice_JoinLeaveGame.lua.
  Initializes MPM, adds local user to lobby, polls DoWork,
  inspects lobby properties, then removes user.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblMultiplayerManagerInitialize
    - command: XblMultiplayerManagerLobbySessionAddLocalUser
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerLobbySessionCorrelationId
    - command: XblMultiplayerManagerLobbySessionLocalMembers
    - command: XblMultiplayerManagerJoinability
    - command: XblMultiplayerManagerLobbySessionSessionReference
    - command: XblMultiplayerManagerLobbySessionRemoveLocalUser
    - command: XblMultiplayerManagerDoWork

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
