id: XSAPI-38-RTA-Connection-State
name: XSAPI 38 - RTA Connection State Monitoring
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer rta/simpleRTA.lua.
  Registers a connection state change handler, triggers RTA via
  social relationship subscription, then removes handlers.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblRealTimeActivityAddConnectionStateChangeHandler
    - command: XblSocialAddSocialRelationshipChangedHandler
    - command: XblSocialRemoveSocialRelationshipChangedHandler
    - command: XblRealTimeActivityRemoveConnectionStateChangeHandler

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
