id: XSAPI-35-MPM-Matchmaking
name: XSAPI 35 - Multiplayer Manager Matchmaking Flow
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer multiplayerManager/MPM_Match.lua.
  Initializes MPM, adds user to lobby, starts matchmaking with FindMatch,
  polls DoWork for match status, then cancels or completes.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 300
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblMultiplayerManagerInitialize
    - command: XblMultiplayerManagerLobbySessionAddLocalUser
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerFindMatch
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerMatchStatus
    - command: XblMultiplayerManagerEstimatedMatchWaitTime
    - command: XblMultiplayerManagerCancelMatch
    - command: XblMultiplayerManagerDoWork
    - command: XblMultiplayerManagerLobbySessionRemoveLocalUser
    - command: XblMultiplayerManagerDoWork

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
