id: XSAPI-39-RTA-Resync
name: XSAPI 39 - RTA Resync Handler
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Registers an RTA resync handler, verifies it can be added and removed.
  Full resync testing requires simulating a reconnection scenario.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblRealTimeActivityAddResyncHandler
    - command: XblRealTimeActivityRemoveResyncHandler

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
