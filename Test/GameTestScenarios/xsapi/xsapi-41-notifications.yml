id: XSAPI-41-Notifications
name: XSAPI 41 - Notification Subscribe and Unsubscribe
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Subscribes to push notifications with a device token,
  then unsubscribes. Platform-specific behavior may vary.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblNotificationSubscribeToNotificationsAsync
    - command: XblNotificationUnsubscribeFromNotificationsAsync

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
