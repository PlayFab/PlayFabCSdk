id: XSAPI-30-Social-Relationship-Changed
name: XSAPI 30 - Social Relationship Change Notification
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer social/social_relationship_changed.lua.
  Registers a social relationship changed handler and a friend request
  count changed handler, then removes them.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblSocialAddSocialRelationshipChangedHandler
    - command: XblSocialAddFriendRequestCountChangedHandler
    - command: XblSocialRemoveSocialRelationshipChangedHandler
    - command: XblSocialRemoveFriendRequestCountChangedHandler

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
