id: XSAPI-23-MP-Invite-Flow
name: XSAPI 23 - Multiplayer Partial Invite Flow
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer mp/mp_partial_invite_flow.lua.
  Signs in, creates XBL context, creates a session, joins, writes,
  sends invites, gets session by handle, then cleans up.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  test:
    - command: XblMultiplayerSessionReferenceCreate
    - command: XblMultiplayerSessionCreateHandle
    - command: XblMultiplayerSessionJoin
    - command: XblMultiplayerWriteSessionAsync
    - command: XblMultiplayerSendInvitesAsync
    - command: XblMultiplayerGetSessionByHandleAsync
    - command: XblMultiplayerSessionCloseHandle

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
