id: XSAPI-02-Achievements
name: XSAPI 02 - Get Achievements for Title
tags:
  - xsapi
platforms:
  xbox: untested
  pc-grts: untested
  pc-inproc: untested
  psx: ignore
description: >
  Port of APIExplorer achievements/achievements.lua.
  Signs in, creates XBL context, queries achievements for the current title,
  paginates through results, and closes the result handle.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  xbl-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: XUserAddAsync
    - command: XblInitialize
      parameters:
        scid: "00000000-0000-0000-0000-000076029b4d"
    - command: XblContextCreateHandle

  get-achievements:
    - command: XblAchievementsGetAchievementsForTitleIdAsync
    - command: XblAchievementsResultGetAchievements
    - command: XblAchievementsResultHasNext
    - command: XblAchievementsResultCloseHandle

executionOrder:
  - role: DeviceA
    block: xbl-init
  - role: DeviceA
    block: get-achievements

cleanup:
  DeviceA:
    - command: XblContextCloseHandle
    - command: XUserCloseHandle
    - command: XblCleanupAsync
    - command: XTaskQueueCloseHandle
