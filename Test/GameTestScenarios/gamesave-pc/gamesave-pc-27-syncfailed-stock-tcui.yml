id: Scenario-PC-27-SyncFailed-Stock-TCUI
name: GameSave PC 27 - SyncFailed Stock TCUI Offline Fallback
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing  # SyncFailed fires correctly, UseOffline works — verified pass125 (3/3 passes)
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Go offline, init WITHOUT custom UI callbacks (stock TCUI mode), trigger sync failure, auto-respond UseOffline, verify offline mode. Then go online, re-init, and verify AddUser succeeds.
brief: SyncFailed stock TCUI UseOffline fallback and recovery
group: D. Sync Failure / Offline
devices:
  DeviceA:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 180
blocks:
  offline-stock-tcui:
    # Stop GRTS, clear cache, disable network, start GRTS cold —
    # ensures AddUser hits SyncFailed instead of using stale cache
    - command: ChangeTargetDeviceState
      parameters:
        action: FlushGrtsAndGoOffline
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    # Do NOT call PFGameSaveFilesSetUiCallbacks — stock TCUI mode
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    # UiNavigator clicks "Play offline" on first SyncFailed dialog
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: UseOffline
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    # Stock TCUI sync failure dialog appears; UiNavigator clicks "Play offline"
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesIsConnectedToCloud
      parameters:
        expectedConnected: false
    - command: PFGameSaveFilesGetFolder
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  online-verify:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    # No custom callbacks — stock TCUI in second session too
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    # Sync succeeds now that network is restored
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceA
    block: offline-stock-tcui
  - role: DeviceA
    block: online-verify
cleanup:
  DeviceA:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: ChangeTargetDeviceState
      parameters:
        action: StartGamingServices
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: false
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
