id: Scenario-PC-114-Conflict-Winner-Retention
name: GameSave PC 114 - Conflict Winner Retained Across Device Switch
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing
  pc-inproc-gamesaves: passing
  psx: ignore
description: >
  Pure SDK (inproc-to-inproc) conflict resolution. DeviceA seeds cloud, DeviceB downloads and
  diverges. DeviceA advances cloud to create conflict. DeviceB resolves UseLocal and uploads.
  DeviceA does fresh sync and verifies winner data is visible. Validates the immediate retention
  service fix (keeps 3 versions) does not break SDK-to-SDK conflict flows.
brief: SDK conflict winner visible after device switch (retention fix validation)
group: C. Conflict Resolution
devices:
  DeviceA:
    engine: pc-grts
  DeviceB:
    engine: pc-inproc-gamesaves
defaults:
  stepTimeoutSeconds: 240
blocks:
  device-a-seed-cloud:
    # DeviceA (GRTS) uploads baseline data to seed the cloud
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateTextFile
            relativePath: slot/progress.sav
            content: "BASELINE_V1"
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  device-b-download-and-diverge:
    # DeviceB (inproc) downloads baseline, then writes divergent local data without uploading
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Overwrite baseline with divergent local data — do NOT upload
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateTextFile
            relativePath: slot/progress.sav
            content: "DEVICE_B_LOCAL"
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  device-a-advance-cloud:
    # DeviceA uploads newer data, advancing cloud past DeviceB's local version
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateTextFile
            relativePath: slot/progress.sav
            content: "CLOUD_ADVANCED_V2"
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  device-b-resolve-conflict-upload:
    # DeviceB detects conflict (local=DEVICE_B_LOCAL vs cloud=CLOUD_ADVANCED_V2), resolves UseLocal, uploads
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseLocal
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # AddUser triggers sync — conflict detected (local vs cloud), auto-resolved UseLocal
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
        expectedContent:
          "slot/progress.sav": "DEVICE_B_LOCAL"
    # Explicitly upload the conflict winner (SDK sends isWinner=true, correct convention)
    - command: PFGameSaveFilesSetSaveDescriptionAsync
      parameters:
        description: "DeviceB - Conflict Winner (UseLocal)"
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  device-a-verify-winner:
    # DeviceA fresh syncs — should see DeviceB's winner data (DEVICE_B_LOCAL)
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Verify winner description visible — proves conflict winner retained across device switch
    - command: PFGameSaveFilesGetSaveDescription
      parameters:
        expectedDescription: "DeviceB - Conflict Winner (UseLocal)"
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
        expectedContent:
          "slot/progress.sav": "DEVICE_B_LOCAL"
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceA
    block: device-a-seed-cloud
  - role: DeviceB
    block: device-b-download-and-diverge
  - role: DeviceA
    block: device-a-advance-cloud
  - role: DeviceB
    block: device-b-resolve-conflict-upload
  - role: DeviceA
    block: device-a-verify-winner
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
