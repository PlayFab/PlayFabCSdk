id: Scenario-PC-102-Regression-TCUI-Closes-On-Terminate
name: GameSave PC 102 - TCUI Dialog Closes Properly on Game Termination
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: ignore  # Known GRTS product bug: SyncFailed UseOffline callback response ignored, TCUI stays stuck
  pc-inproc-gamesaves: ignore
  psx: ignore
description: >
  Launches game offline so sync failure dialog appears, then terminates the game process.
  Relaunches online and verifies no stuck TCUI dialog — clean sync completes normally.
  Regression test for Bug 61173408 (TCUI dialog stuck after termination).
brief: "Regression: TCUI dialog closes properly on game termination"
group: R. Bug Regressions
devices:
  DeviceA:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 180
blocks:
  session-a-offline-launch:
    # Go offline before launching
    - command: ChangeTargetDeviceState
      parameters:
        action: DisableNetwork
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: UseOffline
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    # Sync attempt fails — enters offline mode
    - command: PFGameSaveFilesAddUserWithUiAsync
  session-a-terminate:
    # Terminate the game process while in offline/dialog state
    - command: ChangeTargetDeviceState
      parameters:
        action: TerminateGame
    # Wait for process to fully exit
    - command: SmokeDelay
      parameters:
        durationMs: 5000
  session-a-reconnect-and-relaunch:
    # Restore network
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    # Relaunch the game — fresh process
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    # Verify: game syncs normally — no residual TCUI error state
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: session-a-offline-launch
  - role: DeviceA
    block: session-a-terminate
  - role: DeviceA
    block: session-a-reconnect-and-relaunch
cleanup:
  DeviceA:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: false
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
