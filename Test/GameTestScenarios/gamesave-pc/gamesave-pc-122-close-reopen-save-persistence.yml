id: Scenario-PC-122-Close-Reopen-Save-Persistence
name: GameSave PC 122 - Single Device Close Reopen Save Persistence
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing  # vacuous-pass behavior acceptable — no conflict path exercised but test logic correct
  pc-inproc-gamesaves: ignore
  psx: ignore
description: >
  Reproduces the Forte save stomping bug on a single GRTS device. Device writes
  save v1, uploads, closes app (full uninit). Device reopens, verifies v1 is
  present (snapshot compare). Device writes save v2 (new progress), uploads,
  closes app. Device reopens and verifies v2 is present — NOT v1.
  If the Forte bug is active, the second reopen will show v1 data (old version
  stomps new version).
brief: Single device close-reopen persistence - Forte regression
group: A. Golden Path / Smoke
devices:
  DeviceA:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 240
blocks:
  # Phase 1: Write v1, upload, capture snapshot, close
  phase1-write-v1-and-close:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    # Write v1: "initial progress"
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left  # v1 snapshot for verification in phase 2
    # Close app (full uninit)
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # Phase 2: Reopen, verify v1 present, write v2, upload, capture snapshot, close
  phase2-reopen-write-v2-and-close:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    # DO NOT delete local folder — simulate real game reopen with existing local data
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseLocal
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Verify v1 is still present (snapshot compare left=v1 from phase 1)
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
        ignoreEmptyDirectories: true
    # Write v2: "new progress" (advancing the save)
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 20480
            pattern: [0x11, 0x22, 0x33, 0x44]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right  # v2 snapshot for verification in phase 3
    # Close app
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # Phase 3: Reopen, verify v2 persisted (NOT reverted to v1)
  phase3-reopen-verify-v2:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    # DO NOT delete local folder — real game reopens with existing data
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseLocal
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # KEY VERIFICATION: Compare against v2 snapshot from phase 2
    # If Forte bug is present: data reverts to v1 → snapshot MISMATCH → test FAILS
    # If working correctly: data is v2 → snapshot MATCH → test PASSES
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
        ignoreEmptyDirectories: true
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

executionOrder:
  - role: DeviceA
    block: phase1-write-v1-and-close
  - role: DeviceA
    block: phase2-reopen-write-v2-and-close
  - role: DeviceA
    block: phase3-reopen-verify-v2
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
