id: Scenario-PC-126-TakeRemote-Second-Upload-Flag-Persistence
name: GameSave PC 126 - Does UploadOptions=1 Persist to Second Upload After Conflict
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing
  pc-inproc-gamesaves: ignore
  psx: ignore
description: |
  Tests whether PendingConflictIsWinner=1 persists across multiple uploads after
  a TakeRemote conflict resolution (edge case #1 from conflict block matrix).

  Benjamin Dow ETL confirmed this in production: three consecutive no-conflict
  uploads at 06:44/06:47/06:50 all carried UploadOptions:1.

  If the flag clears after the first post-conflict upload, the second upload
  should use UploadOptions:0 and propagate correctly. If it persists, the
  second upload ALSO carries UploadOptions:1 and gets stomped.

  Flow:
    Phase 1: DeviceA (inproc) seeds cloud with BASELINE_V1
    Phase 2: DeviceB (GRTS) syncs, writes INITIAL, uploads (KeepDeviceActive),
             then writes DIVERGENT after upload (uncommitted change)
    Phase 3: DeviceA advances cloud to CLOUD_V2, then DisableNetwork
    Phase 3b: Terminate DeviceB offline - GRTS packages DIVERGENT
    Phase 4: Relaunch DeviceB -> AddUser ->
             GRTS dirty vs cloud -> CONFLICT -> UseCloud (TakeRemote)
    Phase 5a: Write FIRST_POST_CONFLICT, upload with KeepDeviceActive
              (first post-conflict upload — expected UploadOptions:1)
    Phase 5b: Write SECOND_UPLOAD, upload with ReleaseDeviceAsActive
              (second upload — does it carry UploadOptions:1 or 0?)
    Phase 6: DeviceA verifies — should get SECOND_UPLOAD data

  PASS = DeviceA gets SECOND_UPLOAD data (flag cleared after first upload)
  FAIL = DeviceA gets stale data (flag persists — bug confirmed)
brief: Does UploadOptions=1 persist to 2nd upload after TakeRemote conflict?
group: V. Bug Regression
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
  DeviceB:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 240
blocks:
  # ==========================================================================
  # Phase 1: SDK device (DeviceA/inproc) seeds cloud with BASELINE_V1
  # ==========================================================================
  phase1-sdk-seeds-cloud:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # ==========================================================================
  # Phase 2: GRTS device (DeviceB) syncs and uploads INITIAL data
  # KeepDeviceActive keeps GRTS context alive for later divergent write.
  # ==========================================================================
  phase2-grts-syncs-and-diverges:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Write INITIAL data and upload to commit to GRTS internal storage
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0x11, 0x22, 0x33, 0x44]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    # Block ends. DeviceB process stays alive — SDK active, GRTS tracking.
    # DIVERGENT write happens later in offline-terminate-grts block.

  # ==========================================================================
  # Phase 3: SDK device (DeviceA/inproc) advances cloud, then DisableNetwork
  # ==========================================================================
  phase3-sdk-advances-cloud:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xCC, 0xDD, 0xEE, 0xFF]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    # Disable network AFTER DeviceA finishes — DeviceB writes DIVERGENT offline
    - command: ChangeTargetDeviceState
      parameters:
        action: DisableNetwork

  # ==========================================================================
  # Phase 3b: Terminate DeviceB offline — GRTS defers dirty upload
  # ==========================================================================
  offline-terminate-grts:
    # Write DIVERGENT data while offline — GRTS can't upload
    # This MUST happen here (after DisableNetwork), not in Phase 2.
    # If written online, GRTS tries to upload, gets 409, and ClearSession
    # wipes the dirty state before the new session can detect the conflict.
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xDE, 0xAD, 0xBE, 0xEF]
    # Give GRTS a moment to detect dirty state from the DIVERGENT write
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    # Terminate process. GRTS detects exit, finds dirty data, can't upload -> deferred
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
    # Give GRTS time to process the termination and defer the upload
    - command: SmokeDelay
      parameters:
        durationMs: 10000

  # ==========================================================================
  # Phase 4: GRTS reconnects -> CONFLICT -> UseCloud (TakeRemote)
  # ==========================================================================
  phase4-grts-conflict-takeremote:
    - command: ChangeTargetDeviceState
      parameters:
        action: Relaunch
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    # NO DeleteLocalFolder — GRTS needs stale local data for conflict detection
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    # EnableNetwork — XAL needs a moment to re-establish Xbox Live connectivity
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # AddUser -> GRTS detects dirty internal vs cloud advanced -> CONFLICT
    # UseCloud -> downloads CLOUD_V2 -> PendingConflictDesc{isWinner=true}
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder

  # ==========================================================================
  # Phase 5a: FIRST post-conflict upload (expected UploadOptions:1)
  # Write FIRST_POST_CONFLICT data, upload with KeepDeviceActive
  # ==========================================================================
  phase5a-first-post-conflict-upload:
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xFF, 0xEE, 0xDD, 0xCC]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    # Wait for upload to complete and re-init to settle
    - command: SmokeDelay
      parameters:
        durationMs: 5000

  # ==========================================================================
  # Phase 5b: SECOND upload — the key test
  # If PendingConflictIsWinner persists, this carries UploadOptions:1 (BUG)
  # If it's cleared after first upload, this uses UploadOptions:0 (CORRECT)
  # ==========================================================================
  phase5b-second-upload-flag-test:
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xBB, 0xAA, 0xDD, 0x00]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # ==========================================================================
  # Phase 6: Terminate and sync
  # ==========================================================================
  terminate-and-sync:
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
    - command: WaitForGameSaveSync
      parameters:
        scid: "E18D7"
        timeoutSeconds: 120

  # ==========================================================================
  # Phase 7: DeviceA verifies — should get SECOND_UPLOAD data (0xBBAADD00)
  # ==========================================================================
  phase7-sdk-verifies-second-upload:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
        ignoreEmptyDirectories: true
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

executionOrder:
  - role: DeviceA
    block: phase1-sdk-seeds-cloud
  - role: DeviceB
    block: phase2-grts-syncs-and-diverges
  - role: DeviceA
    block: phase3-sdk-advances-cloud
  - role: DeviceB
    block: offline-terminate-grts
  - role: DeviceB
    block: phase4-grts-conflict-takeremote
  - role: DeviceB
    block: phase5a-first-post-conflict-upload
  - role: DeviceB
    block: phase5b-second-upload-flag-test
  - role: DeviceB
    block: terminate-and-sync
  - role: DeviceA
    block: phase7-sdk-verifies-second-upload

cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
