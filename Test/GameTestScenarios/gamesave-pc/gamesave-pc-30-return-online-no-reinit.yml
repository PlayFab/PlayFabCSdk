id: Scenario-PC-30-Return-Online-No-Reinit
name: GameSave PC 30 - Return Online Without Re-Init
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Go offline, enter offline mode, write local data, verify IsConnectedToCloud=false. Re-enable network and call AddUserWithUiAsync again WITHOUT uninit/reinit. Verify sync succeeds and IsConnectedToCloud=true.
brief: Return online and sync without reinitializing
group: D. Sync Failure / Offline
devices:
  DeviceA:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 240
blocks:
  enter-offline-mode:
    # Stop GRTS, clear cache, disable network, start GRTS cold —
    # ensures AddUser hits SyncFailed instead of using stale cache
    - command: ChangeTargetDeviceState
      parameters:
        action: FlushGrtsAndGoOffline
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    # UiNavigator clicks "Play offline" on SyncFailed dialog
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: UseOffline
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    # Sync fails; UiNavigator clicks "Play offline"; enters offline mode
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesIsConnectedToCloud
      parameters:
        expectedConnected: false
  write-offline-data:
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesIsConnectedToCloud
      parameters:
        expectedConnected: false
  reconnect-no-reinit:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    # Do NOT call PFGameSaveFilesUninitializeAsync or PFGameSaveFilesInitialize —
    # just re-add user to reconnect to cloud
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: false
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesIsConnectedToCloud
      parameters:
        expectedConnected: true
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceA
    block: enter-offline-mode
  - role: DeviceA
    block: write-offline-data
  - role: DeviceA
    block: reconnect-no-reinit
cleanup:
  DeviceA:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: ChangeTargetDeviceState
      parameters:
        action: StartGamingServices
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: false
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
