id: Scenario-PC-130-Crash-Before-Upload-Double-Conflict
name: GameSave PC 130 - Crash After Conflict Before Upload Then Second Conflict
tags:
  - xplatgamesaves
platforms:
  xbox: ignore
  pc-grts: passing
  pc-inproc-gamesaves: ignore
  psx: ignore
description: |
  Tests what happens when GRTS crashes AFTER conflict resolution but BEFORE the
  post-conflict upload completes, then relaunches into a SECOND conflict
  (edge case #5 from conflict block matrix).

  Scenario:
    Phase 1: DeviceA seeds cloud with BASELINE_V1
    Phase 2: DeviceB syncs, uploads INITIAL (KeepActive), writes DIVERGENT offline
    Phase 3: DeviceA advances cloud to CLOUD_V2, DisableNetwork
    Phase 3b: Terminate DeviceB offline (DIVERGENT deferred)
    Phase 4: Relaunch DeviceB → CONFLICT #1 → TakeRemote
             CRASH immediately (Terminate) — NO upload happens
    Phase 5: DeviceA advances cloud to CLOUD_V3 (2nd advance)
    Phase 6: Relaunch DeviceB → CONFLICT #2 (dirty context from #1 vs CLOUD_V3)
             → TakeRemote → Write FINAL data → Upload
    Phase 7: DeviceA verifies → should get FINAL data

  What we're testing:
  - Does GRTS handle a crashed post-conflict state correctly on relaunch?
  - Does a SECOND conflict resolution fire normally after a crashed first?
  - Is PendingConflictIsWinner set fresh on the second conflict?
  - Does the upload after the second conflict succeed without 409?

  PASS = DeviceA gets FINAL data, second conflict resolves cleanly
  FAIL = Upload fails (409), data lost, or GRTS errors on relaunch
brief: Crash after conflict #1 before upload, then conflict #2 — does it recover?
group: V. Bug Regression
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
  DeviceB:
    engine: pc-grts
defaults:
  stepTimeoutSeconds: 240
blocks:
  # ==========================================================================
  # Phase 1: SDK device (DeviceA/inproc) seeds cloud with BASELINE_V1
  # ==========================================================================
  phase1-sdk-seeds-cloud:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # ==========================================================================
  # Phase 2: GRTS device (DeviceB) syncs and uploads INITIAL data
  # ==========================================================================
  phase2-grts-syncs-and-uploads:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0x11, 0x22, 0x33, 0x44]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive

  # ==========================================================================
  # Phase 3: DeviceA advances cloud to CLOUD_V2, then DisableNetwork
  # ==========================================================================
  phase3-sdk-advances-cloud:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xCC, 0xDD, 0xEE, 0xFF]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: ChangeTargetDeviceState
      parameters:
        action: DisableNetwork

  # ==========================================================================
  # Phase 3b: Terminate DeviceB offline — GRTS defers dirty upload
  # ==========================================================================
  offline-terminate-grts:
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xDE, 0xAD, 0xBE, 0xEF]
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
    - command: SmokeDelay
      parameters:
        durationMs: 10000

  # ==========================================================================
  # Phase 4: CONFLICT #1 → TakeRemote → CRASH (no upload)
  # Relaunch, resolve conflict, then immediately terminate.
  # The post-conflict upload never happens — simulates game crash.
  # ==========================================================================
  phase4-conflict1-then-crash:
    - command: ChangeTargetDeviceState
      parameters:
        action: Relaunch
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    # NO DeleteLocalFolder — GRTS needs stale state for conflict detection
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # AddUser → CONFLICT #1 → TakeRemote (auto-response)
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # CRASH! Terminate immediately — no upload happens
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
    - command: SmokeDelay
      parameters:
        durationMs: 5000

  # ==========================================================================
  # Phase 5: DeviceA advances cloud AGAIN (CLOUD_V3) — creates 2nd version bump
  # This ensures that when DeviceB relaunches, cloud has advanced past the
  # first conflict resolution, triggering CONFLICT #2.
  # ==========================================================================
  phase5-sdk-advances-cloud-v3:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0x99, 0x88, 0x77, 0x66]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # ==========================================================================
  # Phase 6: CONFLICT #2 → TakeRemote → Write FINAL → Upload
  # DeviceB relaunches with dirty state from crashed session #1.
  # Cloud has advanced (CLOUD_V3) → GRTS detects conflict.
  # After resolving, write new data and upload successfully.
  # ==========================================================================
  phase6-conflict2-resolve-and-upload:
    - command: ChangeTargetDeviceState
      parameters:
        action: Relaunch
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    # NO DeleteLocalFolder — keep crashed session's dirty state
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceB"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # AddUser → CONFLICT #2 (dirty from crash vs CLOUD_V3) → TakeRemote
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Write FINAL data and upload
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 10240
            pattern: [0xAB, 0xCD, 0xEF, 0x99]
    - command: PFGameSaveFilesSetSaveDescriptionAsync
      parameters:
        description: "DeviceB - FINAL After Double Conflict"
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  # ==========================================================================
  # Phase 7: Terminate and sync
  # ==========================================================================
  terminate-and-sync:
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
    - command: WaitForGameSaveSync
      parameters:
        scid: "E18D7"
        timeoutSeconds: 120

  # ==========================================================================
  # Phase 8: DeviceA verifies — should get FINAL data (0xABCDEF99)
  # ==========================================================================
  phase8-sdk-verifies-final:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: AutoNavigateGameSaveUi
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\DeviceA"
    - command: PFGameSaveFilesSetWriteManifestsToDiskForDebug
      parameters:
        writeManifests: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Verify description proves double-conflict resolved and FINAL uploaded
    - command: PFGameSaveFilesGetSaveDescription
      parameters:
        expectedDescription: "DeviceB - FINAL After Double Conflict"
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
        ignoreEmptyDirectories: true
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

executionOrder:
  - role: DeviceA
    block: phase1-sdk-seeds-cloud
  - role: DeviceB
    block: phase2-grts-syncs-and-uploads
  - role: DeviceA
    block: phase3-sdk-advances-cloud
  - role: DeviceB
    block: offline-terminate-grts
  - role: DeviceB
    block: phase4-conflict1-then-crash
  - role: DeviceA
    block: phase5-sdk-advances-cloud-v3
  - role: DeviceB
    block: phase6-conflict2-resolve-and-upload
  - role: DeviceB
    block: terminate-and-sync
  - role: DeviceA
    block: phase8-sdk-verifies-final

cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
