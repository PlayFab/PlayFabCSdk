id: Scenario-Inproc-47-Device-Id-Stable-Across-Relaunch
name: GameSave Inproc 47 - Device ID Stable Across Relaunch
tags:
  - gamesaves
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc-gamesaves: passing
  psx: ignore
description: >
  Verifies the in-process SDK-generated device id (persisted in
  cloudsync/info.json) is STABLE across a relaunch. Reproduces the customer
  report that Steam Deck (in-proc) players generate a new device id every
  session. Session one uploads and captures the device id; session two relaunches
  against the same save folder and asserts the persisted device id is unchanged,
  including after a second upload.
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
defaults:
  stepTimeoutSeconds: 180
blocks:
  session-one-upload:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave"
        # Opt out of the harness mock device id so the SDK generates and persists
        # its own device id in cloudsync/info.json (the real SteamDeck code path).
        useRealDeviceId: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesResetCloudAsync
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Clear stale local files but keep the root-level cloudsync folder so the
    # persisted device id (cloudsync/info.json) survives into the relaunch.
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: true
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    # Capture the persisted device id. Stored as ${DeviceA.persistedDeviceId} for
    # the relaunch assertion below.
    - command: ReadDeviceId
      parameters:
        requirePresent: true
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  session-two-relaunch:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave"
        # Opt out of the harness mock device id so the SDK generates and persists
        # its own device id in cloudsync/info.json (the real SteamDeck code path).
        useRealDeviceId: true
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Core assertion: after a fresh process/session against the same save folder,
    # the persisted device id must match session one (no new id generated).
    - command: ReadDeviceId
      parameters:
        requirePresent: true
        expectedDeviceId: "${DeviceA.persistedDeviceId}"
    # A second upload must not rotate the device id either.
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload2.bin
            bytes: 4096
            pattern: [0x11, 0x22, 0x33, 0x44]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: ReadDeviceId
      parameters:
        requirePresent: true
        expectedDeviceId: "${DeviceA.persistedDeviceId}"
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceA
    block: session-one-upload
  - role: DeviceA
    block: session-two-relaunch
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
