id: Scenario-Inproc-07-Conflict-Resolution-Cloud-Wins
name: GameSave Inproc 07 - Conflict Resolution – Cloud Wins
tags:
  - gamesaves
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc-gamesaves: passing
  psx: passing
description: |
  Mirror of Scenario 6 but DeviceA chooses TakeRemote, discarding local changes for cloud version.
  DeviceA uploads baseline, DeviceB downloads baseline and uploads a change.
  DeviceA modifies locally (creating pending local changes), then calls AddUserWithUiAsync.
  This triggers a conflict since DeviceA has local changes AND cloud has DeviceB's version.
  DeviceA chooses TakeRemote to discard its local changes and use DeviceB's cloud version.
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
  DeviceB:
    engine: pc-inproc-gamesaves
defaults:
  stepTimeoutSeconds: 240
blocks:
  devicea-upload-baseline:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\DeviceA"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 4096
            pattern: [0xBA, 0x5E]
          - verb: CreateTextFile
            relativePath: settings/options.json
            content: '{"version":"baseline"}'
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  deviceb-download-and-upload-change:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\DeviceB"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # Download baseline from cloud
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Modify slotA and upload - this becomes the new cloud version
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 5120
            pattern: [0xC1, 0x0D, 0xAA, 0x77]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    # Capture DeviceB's cloud state - this is what DeviceA should end up with
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  devicea-local-change-and-sync-conflict:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\DeviceA"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # Before AddUser, modify local files to create pending local changes
    # The local state still has baseline from previous session, modify slotA
    - command: WriteGameSaveData
      parameters:
        saveFolder: "C:\\gamesave\\DeviceA"
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 6144
            pattern: [0x10, 0xCA, 0x10, 0x11]
    # Set conflict auto-response to TakeRemote (discard local, use DeviceB's cloud version)
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    # AddUserWithUiAsync detects conflict: local slotA modified + cloud slotA differs
    # Conflict callback fires, auto-response is TakeRemote
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Capture state after conflict resolution - should match cloud (left from DeviceB)
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    # Verify cloud version won (left == right, DeviceB's data overwrote local).
    #
    # ignoreTimestamps: this comparison used to fail intermittently on mtime metadata while
    # the content matched exactly. Confirmed mechanism: when TakeRemote resolves the conflict,
    # the SDK only re-downloads files whose content actually differs from the cloud. A file
    # DeviceA rewrote locally with identical bytes is therefore left in place, keeping
    # DeviceA's newer local mtime, while DeviceB's copy carries the cloud timestamp. The gap
    # is wall-clock dependent, so it sits inside the comparer's 3s tolerance on a fast run and
    # outside it on a slow one - a coin flip, not a real defect. Cross-device mtime equality
    # is not a property the SDK guarantees (see ExecuteVerifyGameSaveUtilDownload, which
    # defaults ignoreTimestamps to true for this reason, and the psx path that force-enables it).
    #
    # The assertion that matters - DeviceA's content is now byte-for-byte DeviceB's cloud
    # version - remains fully enforced: file set, total bytes, per-file size and SHA256 are all
    # still compared. Verified by negative control: with ignoreTimestamps on, flipping this
    # scenario to UseLocal still fails on size + hash.
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: devicea-upload-baseline
  - role: DeviceB
    block: deviceb-download-and-upload-change
  - role: DeviceA
    block: devicea-local-change-and-sync-conflict
cleanup:
  DeviceA:
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: false
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceA"
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceB"
