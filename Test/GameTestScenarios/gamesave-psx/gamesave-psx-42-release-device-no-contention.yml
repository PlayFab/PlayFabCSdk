id: Scenario-PSX-41-Release-Device-No-Contention
name: GameSave PSX 41 - Release Device As Active Prevents Contention (DeviceA=PC inproc, DeviceB=PS5)
tags:
  - psx
  - gamesaves
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc-gamesaves: passing
  psx: ignore
description: >
  Reproduces the Forte Steam Deck bug scenario: Device A does multiple uploads with
  KeepDeviceActive (simulating gameplay saves), then a final upload with ReleaseDeviceAsActive
  (simulating "Sync & Exit"). Device B then syncs and must NOT see active device contention.
  Device B deliberately does NOT set a contention auto-response so the test will hang/timeout
  if contention is incorrectly triggered, proving the release worked.
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
  DeviceB:
    engine: psx
defaults:
  stepTimeoutSeconds: 240
blocks:
  device-a-gameplay-and-release:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\DeviceA"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot

    # --- Simulate gameplay: multiple KeepDeviceActive uploads ---

    # Upload 1: initial save
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/save.dat
            bytes: 4096
            pattern: [0xAA, 0x01]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive

    # Upload 2: mid-gameplay checkpoint
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/save.dat
            bytes: 6144
            pattern: [0xAA, 0x02]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive

    # Upload 3: another checkpoint
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/save.dat
            bytes: 8192
            pattern: [0xAA, 0x03]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive

    # --- Simulate "Sync & Exit": final upload with ReleaseDeviceAsActive ---
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/save.dat
            bytes: 10240
            pattern: [0xAA, 0x04]
    - command: PFGameSaveFilesSetSaveDescriptionAsync
      parameters:
        description: "Device A - Final Save"
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive

    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  device-b-sync-no-contention:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\DeviceB"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    # DELIBERATELY no PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse here.
    # If contention fires, no response is provided, the state machine stalls,
    # and the test times out -- proving the bug exists.
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true

    # This MUST succeed without triggering active device contention
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder

    # Verify Device A's data arrived
    - command: PFGameSaveFilesGetSaveDescription
      parameters:
        expectedDescription: "Device A - Final Save"
    - command: PFGameSaveFilesIsConnectedToCloud
      parameters:
        expectedConnected: true

    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true

  device-b-cleanup:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceB"

executionOrder:
  - role: DeviceA
    block: device-a-gameplay-and-release
  - role: DeviceB
    block: device-b-sync-no-contention
  - role: DeviceB
    block: device-b-cleanup

cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceA"
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\DeviceB"
