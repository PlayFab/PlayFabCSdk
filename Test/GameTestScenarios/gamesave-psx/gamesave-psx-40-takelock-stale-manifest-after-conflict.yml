id: Scenario-PSX-40-TakeLock-Stale-Manifest-After-Conflict
name: GameSave PSX 40 - TakeLock Uses Correct Version After Take Remote Conflict (DeviceA=PC inproc, DeviceB=PS5)
tags:
  - psx
  - gamesaves
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc-gamesaves: passing
  psx: ignore
description: |
  Verifies that after a "Take Remote" conflict resolution, the TakeLock step
  correctly uses the conflict winner as the base version (data ancestor) and
  computes the new manifest version high enough to avoid collisions with the
  conflict loser.

  Bug: Before the fix, UploadStep TakeLock derived both base and new version
  from m_postUploadLatestFinalizedPFManifest (the winner). The new version
  (winner + 1) would collide with the already-existing loser manifest,
  causing MANIFEST_VERSION_ALREADY_EXISTS retries. The base version was
  correct (the winner) but the new version computation was wrong.

  Flow:
  1. DeviceA uploads baseline (v1 finalized)
  2. DeviceB downloads baseline, modifies, uploads change (v2 finalized)
  3. DeviceA modifies locally, AddUser â†’ conflict detected â†’ Take Remote
     - Conflict upload finalizes local data as loser (v3)
     - TakeLock should use base=v2 (winner, the data ancestor) and
       new version=v4 (higher than all existing including v3 loser)
  4. DeviceA writes new data and uploads with KeepDeviceActive
  5. DeviceB downloads and verifies it sees DeviceA's latest data

  Without the fix, step 3's TakeLock uses new version = v2+1 = v3 which
  collides with the loser. With the fix, new version = max(all) + 1 = v4.
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
  DeviceB:
    engine: psx
defaults:
  stepTimeoutSeconds: 240
blocks:
  devicea-upload-baseline:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\TakeLockA"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\TakeLockA"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    # Create baseline save data
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 4096
            pattern: [0xBA, 0x5E]
          - verb: CreateTextFile
            relativePath: settings/options.json
            content: '{"version":"baseline"}'
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  deviceb-download-and-upload-change:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\TakeLockB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\TakeLockB"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # Download baseline from cloud
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Modify slotA and upload - this becomes the new cloud version
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 5120
            pattern: [0xC1, 0x0D, 0xAA, 0x77]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  devicea-conflict-then-upload:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\TakeLockA"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # Before AddUser, modify local files to create pending local changes
    - command: WriteGameSaveData
      parameters:
        saveFolder: "C:\\gamesave\\TakeLockA"
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 6144
            pattern: [0x10, 0xCA, 0x10, 0x11]
    # Set conflict auto-response to TakeRemote
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    # AddUserWithUiAsync detects conflict, auto-resolves with TakeRemote
    # Internally: conflict upload finalizes local as loser, then TakeLock
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # After Take Remote conflict resolution, cloud data should be present
    - command: VerifyFileContent
      parameters:
        relativePath: settings/options.json
        expectedContent: '{"version":"baseline"}'
    # Now write NEW data and upload with KeepDeviceActive
    # This exercises the pending manifest created by TakeLock after conflict
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: slotA/character.sav
            bytes: 8192
            pattern: [0xDE, 0xAD, 0xBE, 0xEF]
          - verb: CreateTextFile
            relativePath: settings/options.json
            content: '{"version":"post-conflict-upload"}'
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    # Capture DeviceA's state after post-conflict upload
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

  deviceb-verify-final-state:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\TakeLockB"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\TakeLockB"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # Download from cloud - should get DeviceA's post-conflict upload
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Verify DeviceB got the post-conflict uploaded data
    - command: VerifyFileContent
      parameters:
        relativePath: settings/options.json
        expectedContent: '{"version":"post-conflict-upload"}'
    # Capture DeviceB's state - should match DeviceA
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

executionOrder:
  - role: DeviceA
    block: devicea-upload-baseline
  - role: DeviceB
    block: deviceb-download-and-upload-change
  - role: DeviceA
    block: devicea-conflict-then-upload
  - role: DeviceB
    block: deviceb-verify-final-state

cleanup:
  DeviceA:
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: false
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\TakeLockA"
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\TakeLockB"
