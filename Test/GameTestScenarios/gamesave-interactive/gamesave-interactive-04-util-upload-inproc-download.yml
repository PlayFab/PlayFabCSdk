id: Interactive-04-Util-Upload-Inproc-Download
name: 4. pfgamesaveutil Upload -> Inproc Download & Verify
tags:
  - interactive
  - gamesaves
  - transfer
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc-gamesaves: passing
  psx: ignore
description: >
  pfgamesaveutil uploads a dataset (with files and subfolders) out-of-band for the
  harness player. This scenario downloads that cloud save via the inproc SDK and
  verifies it transferred intact by comparing the downloaded container against the
  known source folder (snapshot 'left' = source, 'right' = downloaded).
devices:
  DeviceA:
    engine: pc-inproc-gamesaves
defaults:
  stepTimeoutSeconds: 240
blocks:
  download-and-verify:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: DeleteLocalFolder
      parameters:
        folderPath: "C:\\gamesave\\xfer1"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesave\\xfer1"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFLocalUserCreateHandleWithPersistedLocalId
      parameters:
        persistedLocalId: "GameTestHarness"
        customId: "GameTestHarness"
        createAccount: true
    # AddUser downloads the latest finalized cloud save (uploaded by pfgamesaveutil).
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Snapshot the downloaded container.
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    # Rebuild the expected content from the known source folder pfgamesaveutil uploaded.
    - command: DeleteSaveRoot
    - command: CopyTargetFolderToSaveFolder
      parameters:
        sourceFolder: "C:\\temp\\pfgs-xfer\\util-to-inproc"
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    # Verify the downloaded save matches the source (files + subfolders, by content hash).
    - command: CompareSaveContainerSnapshots
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: download-and-verify
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
