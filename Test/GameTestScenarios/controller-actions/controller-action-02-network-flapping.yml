id: Controller-Action-02-Network-Flapping
name: Controller Action 02 - Network Flapping
tags:
  - xboxactions
platforms:
  xbox: untested
  pc-grts: ignore
  pc-inproc: ignore
  psx: ignore
description: Verify NetworkFlapping cycles network on/off rapidly (3 cycles, 2s interval).
devices:
  DeviceA:
    engine: xbox
defaults:
  stepTimeoutSeconds: 120
blocks:
  init:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
  test:
    - command: ChangeTargetDeviceState
      parameters:
        action: NetworkFlapping
        cycles: 3
        intervalMs: 2000
    - command: SmokeDelay
      parameters:
        durationMs: 3000
  cleanup:
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: init
  - role: DeviceA
    block: test
  - role: DeviceA
    block: cleanup
