id: Controller-Action-13-Simulate-Out-Of-Storage
name: Controller Action 13 - Simulate Out Of Storage / Stop Simulation
tags:
  - xboxactions
platforms:
  xbox: untested
  pc-grts: ignore
  pc-inproc: ignore
  psx: ignore
description: Verify SimulateOutOfStorage forces out-of-storage conditions and StopStorageSimulation clears them.
devices:
  DeviceA:
    engine: xbox
defaults:
  stepTimeoutSeconds: 120
blocks:
  init:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
  test:
    - command: ChangeTargetDeviceState
      parameters:
        action: SimulateOutOfStorage
        mode: forceOutOfStorage
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    - command: ChangeTargetDeviceState
      parameters:
        action: StopStorageSimulation
    - command: SmokeDelay
      parameters:
        durationMs: 3000
    # Also test reserveRemaining mode
    - command: ChangeTargetDeviceState
      parameters:
        action: SimulateOutOfStorage
        mode: reserveRemaining
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    - command: ChangeTargetDeviceState
      parameters:
        action: StopStorageSimulation
    - command: SmokeDelay
      parameters:
        durationMs: 3000
  cleanup:
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: init
  - role: DeviceA
    block: test
  - role: DeviceA
    block: cleanup
