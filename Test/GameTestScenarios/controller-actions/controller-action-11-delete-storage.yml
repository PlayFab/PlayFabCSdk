id: Controller-Action-11-Delete-Storage
name: Controller Action 11 - Delete Connected Storage
tags:
  - xboxactions
platforms:
  xbox: untested
  pc-grts: ignore
  pc-inproc: ignore
  psx: ignore
description: Verify DeleteStorage removes Connected Storage data for a specific user/SCID on the console via xbstorage.
devices:
  DeviceA:
    engine: xbox
defaults:
  stepTimeoutSeconds: 120
blocks:
  init:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
  test:
    - command: ChangeTargetDeviceState
      parameters:
        action: DeleteStorage
        msa: testuser@xboxtest.com
        scid: "00000000-0000-0000-0000-00000000E18D"
    - command: SmokeDelay
      parameters:
        durationMs: 3000
  cleanup:
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: init
  - role: DeviceA
    block: test
  - role: DeviceA
    block: cleanup
