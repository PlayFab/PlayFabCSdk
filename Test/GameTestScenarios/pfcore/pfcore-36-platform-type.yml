id: PFCore-36-Platform-Type
name: PFCore 36 - Platform Type Detection
tags:
  - pfcore
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Calls PFPlatformGetPlatformType and verifies it returns a valid
  platform identifier for the current environment.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 60
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"

  test:
    - command: PFPlatformGetPlatformType

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle