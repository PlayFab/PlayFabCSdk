id: PFCore-41-Concurrent-Logins
name: PFCore 41 - Concurrent Logins
tags:
  - pfcore
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Starts two CustomID logins sequentially with different IDs,
  verifies both complete with valid entity handles.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"

  test:
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfcore-concurrent-a-41"
        createAccount: true
    - command: PFEntityGetEntityKey
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfcore-concurrent-b-41"
        createAccount: true
    - command: PFEntityGetEntityKey

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle