id: PFCore-09-Login-CustomID
name: PFCore 09 - Login with CustomID
tags:
  - pfcore
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Logs in with a custom ID and createAccount=true,
  gets entity handle, verifies entity key.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"

  test:
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfcore-test-custom-id-09"
        createAccount: true
    - command: PFEntityGetEntityKey

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle