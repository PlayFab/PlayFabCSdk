id: PFCore-33-HTTP-Retry
name: PFCore 33 - HTTP Retry Settings Round-Trip
tags:
  - pfcore
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Sets custom HTTP retry values, reads them back, and verifies
  they match. Resets to defaults.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 60
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"

  test:
    - command: PFSetHttpRetrySettings
      parameters:
        maxRetries: 5
        retryDelay: 2
    - command: PFGetHttpRetrySettings

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle