id: PFCore-29-Pipeline-Entity-Mgmt
name: PFCore 29 - Event Pipeline Entity Management
tags:
  - pfcore
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Creates a telemetry pipeline with key, adds an uploading entity,
  emits events, removes the entity.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFLocalUserLoginAsync

  test:
    - command: PFLocalUserTryGetEntityHandle
    - command: PFEventPipelineCreateTelemetryPipelineHandleWithKey
    - command: PFEventPipelineAddUploadingEntity
    - command: PFEventPipelineEmitEvent
      parameters:
        eventNamespace: "custom.playfab.events"
        eventName: "pfcore_test_entity_mgmt"
    - command: PFEventPipelineRemoveUploadingEntity
    - command: PFEventPipelineCloseHandle

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle
