id: PFCore-18-Get-Entity
name: PFCore 18 - Get Entity with Authentication API
tags:
  - pfcore
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Calls PFAuthenticationGetEntityAsync for the current entity
  and verifies it returns the correct entity key.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFLocalUserLoginAsync

  test:
    - command: PFLocalUserTryGetEntityHandle
    - command: PFAuthenticationGetEntityAsync
    - command: PFEntityGetEntityKey

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle
