id: PFServices-72-Data-File-Delete
name: PFServices 72 - File Delete
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # FinalizeFileUploads fails - no actual file data uploaded to the URL
  psx: ignore
description: >
  Uploads a file then deletes it and verifies removal.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFDataInitiateFileUploadsAsync
    - command: PFDataInitiateFileUploadsGetResult
    - command: PFDataFinalizeFileUploadsAsync
    - command: PFDataFinalizeFileUploadsGetResult
    - command: PFDataDeleteFilesAsync
    - command: PFDataDeleteFilesGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle