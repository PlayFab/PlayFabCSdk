id: PFServices-33-Stats-Delete
name: PFServices 33 - Delete Statistics
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Sets stats then deletes them and verifies removal.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFStatisticsUpdateStatisticsAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, statistics required
    - command: PFStatisticsUpdateStatisticsGetResult
    - command: PFStatisticsDeleteStatisticsAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, statistics required
    - command: PFStatisticsDeleteStatisticsGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle