id: PFServices-81-MPS-Build-Aliases
name: PFServices 81 - List Build Aliases
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Lists all multiplayer server build aliases and verifies structure.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFMultiplayerServerListBuildAliasesAsync
    - command: PFMultiplayerServerListBuildAliasesGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle