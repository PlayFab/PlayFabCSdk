id: PFServices-68-CloudScript-Entity
name: PFServices 68 - Execute Entity Cloud Script
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Runs cloud script in entity context and verifies result.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFCloudScriptExecuteEntityCloudScriptAsync
    - command: PFCloudScriptExecuteEntityCloudScriptGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle