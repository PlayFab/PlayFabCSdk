id: PFServices-87-Segments-Tags
name: PFServices 87 - Player Tags Lifecycle
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_PF_NOSECRETKEY (0x89235412) - Server API requires secret key
  psx: ignore
description: >
  Adds a tag to a player, verifies via get, then removes the tag.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFSegmentsServerAddPlayerTagAsync
    - command: PFSegmentsClientGetPlayerTagsAsync
    - command: PFSegmentsClientGetPlayerTagsGetResult
    - command: PFSegmentsServerRemovePlayerTagAsync

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle