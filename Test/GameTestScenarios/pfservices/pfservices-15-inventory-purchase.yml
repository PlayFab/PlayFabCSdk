id: PFServices-15-Inventory-Purchase
name: PFServices 15 - Purchase Inventory Items
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Purchases an item using virtual currency and verifies item added and currency deducted.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFInventoryPurchaseInventoryItemsAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, item to purchase required
    - command: PFInventoryPurchaseInventoryItemsGetResult
    - command: PFInventoryGetInventoryItemsAsync
    - command: PFInventoryGetInventoryItemsGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle