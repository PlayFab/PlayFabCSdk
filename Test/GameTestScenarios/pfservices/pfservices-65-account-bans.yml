id: PFServices-65-Account-Bans
name: PFServices 65 - Server Ban and Unban Lifecycle
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_PF_NOSECRETKEY (0x89235412) - ServerBanUsers requires secret key
  psx: ignore
description: >
  Bans a test user, verifies bans, then revokes all bans.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFAccountManagementServerBanUsersAsync
    - command: PFAccountManagementServerBanUsersGetResult
    - command: PFAccountManagementServerGetUserBansAsync
    - command: PFAccountManagementServerGetUserBansGetResult
    - command: PFAccountManagementServerRevokeAllBansForUserAsync
    - command: PFAccountManagementServerRevokeAllBansForUserGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle