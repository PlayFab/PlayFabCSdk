id: PFServices-40-PlayerData-Server-Publisher
name: PFServices 40 - Server Publisher Data Round-Trip
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Sets publisher data from server, reads it back to verify.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFPlayerDataManagementServerUpdateUserPublisherDataAsync
      expectFailure: true  # E_PF_NOSECRETKEY (0x89235412) - Server API requires secret key
    - command: PFPlayerDataManagementServerUpdateUserPublisherDataGetResult
    - command: PFPlayerDataManagementServerGetUserPublisherDataAsync
      expectFailure: true  # E_PF_NOSECRETKEY (0x89235412) - Server API requires secret key
    - command: PFPlayerDataManagementServerGetUserPublisherDataGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle