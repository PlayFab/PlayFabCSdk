id: PFServices-10-Catalog-Moderation
name: PFServices 10 - Item Moderation State
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Gets an item moderation state, sets a new state, and verifies the change.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFCatalogGetItemModerationStateAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity, not title_player_account
    - command: PFCatalogGetItemModerationStateGetResult
    - command: PFCatalogSetItemModerationStateAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity
    - command: PFCatalogGetItemModerationStateAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity, not title_player_account
    - command: PFCatalogGetItemModerationStateGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle