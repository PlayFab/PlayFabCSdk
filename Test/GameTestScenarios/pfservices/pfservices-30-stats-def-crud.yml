id: PFServices-30-Stats-Def-CRUD
name: PFServices 30 - Create, Get, and Delete Statistic Definition
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Creates a statistic definition, reads it back, then deletes it.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFStatisticsCreateStatisticDefinitionAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity
    - command: PFStatisticsGetStatisticDefinitionAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity
    - command: PFStatisticsGetStatisticDefinitionGetResult
    - command: PFStatisticsDeleteStatisticDefinitionAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle