id: PFServices-95-Edge-Inventory-Idempotency
name: PFServices 95 - Inventory Idempotency
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_PF_ITEM_NOT_FOUND (0x89235450) - test inventory item does not exist in catalog
  psx: ignore
description: >
  Executes the same inventory operation twice with same idempotency key and verifies no duplication.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFInventoryExecuteInventoryOperationsAsync
      parameters:
        idempotencyId: "pfservices-test-idempotency-95"
    - command: PFInventoryExecuteInventoryOperationsGetResult
    - command: PFInventoryExecuteInventoryOperationsAsync
      parameters:
        idempotencyId: "pfservices-test-idempotency-95"
    - command: PFInventoryExecuteInventoryOperationsGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle