id: PFServices-66-Account-Add-Credentials
name: PFServices 66 - Add Username and Password
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_NOTIMPL (0x80004001) - AddUsernamePassword not implemented
  psx: ignore
description: >
  Adds username/password credentials to an anonymously created account.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFAccountManagementClientAddUsernamePasswordAsync
    - command: PFAccountManagementClientAddUsernamePasswordGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle