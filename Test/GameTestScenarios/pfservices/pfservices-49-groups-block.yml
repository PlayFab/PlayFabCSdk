id: PFServices-49-Groups-Block
name: PFServices 49 - Group Block and Unblock
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Creates a group, blocks an entity, lists blocks, then unblocks.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFGroupsCreateGroupAsync
    - command: PFGroupsCreateGroupGetResult
    - command: PFGroupsBlockEntityAsync
    - command: PFGroupsListGroupBlocksAsync
    - command: PFGroupsListGroupBlocksGetResult
    - command: PFGroupsUnblockEntityAsync
    - command: PFGroupsDeleteGroupAsync

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle