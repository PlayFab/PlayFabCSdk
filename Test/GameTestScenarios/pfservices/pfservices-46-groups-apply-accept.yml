id: PFServices-46-Groups-Apply-Accept
name: PFServices 46 - Group Apply and Accept
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # ApplyToGroup fails - creator is already a member, needs second entity
  psx: ignore
description: >
  Creates a group, applies for membership, lists applications, accepts the application, verifies membership.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFGroupsCreateGroupAsync
    - command: PFGroupsCreateGroupGetResult
    - command: PFGroupsApplyToGroupAsync
    - command: PFGroupsApplyToGroupGetResult
    - command: PFGroupsListGroupApplicationsAsync
    - command: PFGroupsListGroupApplicationsGetResult
    - command: PFGroupsAcceptGroupApplicationAsync
    - command: PFGroupsListGroupMembersAsync
    - command: PFGroupsListGroupMembersGetResult
    - command: PFGroupsDeleteGroupAsync

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle