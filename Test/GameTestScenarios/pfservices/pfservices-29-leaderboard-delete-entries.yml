id: PFServices-29-Leaderboard-Delete-Entries
name: PFServices 29 - Delete Leaderboard Entries
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Posts entries then deletes specific ones and verifies removal.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFLeaderboardsUpdateLeaderboardEntriesAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, entries required
    - command: PFLeaderboardsDeleteLeaderboardEntriesAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, leaderboard name required

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle