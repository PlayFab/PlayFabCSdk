id: PFServices-80-TitleData-Internal
name: PFServices 80 - Server Title Internal Data
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_PF_NOSECRETKEY (0x89235412) - Server API requires secret key
  psx: ignore
description: >
  Sets internal-only title data from server, reads back via server API.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFTitleDataManagementServerSetTitleInternalDataAsync
    - command: PFTitleDataManagementServerGetTitleInternalDataAsync
    - command: PFTitleDataManagementServerGetTitleInternalDataGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle