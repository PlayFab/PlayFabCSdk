id: PFServices-39-PlayerData-Server-Update
name: PFServices 39 - Server User Data Update
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Sets user data from server side, then reads from client to verify cross-path consistency.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFPlayerDataManagementServerUpdateUserDataAsync
      expectFailure: true  # E_PF_NOSECRETKEY (0x89235412) - Server API requires secret key, not available in CustomID login
    - command: PFPlayerDataManagementServerUpdateUserDataGetResult
    - command: PFPlayerDataManagementClientGetUserDataAsync
    - command: PFPlayerDataManagementClientGetUserDataGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle