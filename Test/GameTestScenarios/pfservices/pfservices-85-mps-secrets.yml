id: PFServices-85-MPS-Secrets
name: PFServices 85 - Secrets Management
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: failing  # E_NOTIMPL (0x80004001) - UploadSecret not implemented
  psx: ignore
description: >
  Uploads a secret, lists secret summaries, then deletes the secret.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFMultiplayerServerUploadSecretAsync
    - command: PFMultiplayerServerListSecretSummariesAsync
    - command: PFMultiplayerServerListSecretSummariesGetResult
    - command: PFMultiplayerServerDeleteSecretAsync

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle