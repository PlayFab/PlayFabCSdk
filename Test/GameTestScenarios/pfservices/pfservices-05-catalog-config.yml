id: PFServices-05-Catalog-Config
name: PFServices 05 - Catalog Config Get and Update
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Gets the catalog config, updates it, reads again to verify the change.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFCatalogGetCatalogConfigAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity, not title_player_account
    - command: PFCatalogGetCatalogConfigGetResult
    - command: PFCatalogUpdateCatalogConfigAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity, not title_player_account
    - command: PFCatalogGetCatalogConfigAsync
      expectFailure: true  # E_PF_NOT_AUTHORIZED (0x89235478) - requires title entity, not title_player_account
    - command: PFCatalogGetCatalogConfigGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle