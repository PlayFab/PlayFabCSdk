id: PFServices-16-Inventory-Batch-Ops
name: PFServices 16 - Execute Inventory Operations (Batch)
tags:
  - pfservices
platforms:
  xbox: ignore
  pc-grts: ignore
  pc-inproc: passing
  psx: ignore
description: >
  Executes multiple inventory operations atomically in a single batch call.
devices:
  DeviceA: {}
defaults:
  stepTimeoutSeconds: 180
blocks:
  pf-init:
    - command: XGameRuntimeInitialize
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "pfservices-test"
        createAccount: true

  test:
    - command: PFInventoryExecuteInventoryOperationsAsync
      expectFailure: true  # E_PF_INVALID_PARAMS (0x89235421) - empty request, operation required
    - command: PFInventoryExecuteInventoryOperationsGetResult
    - command: PFInventoryGetInventoryItemsAsync
    - command: PFInventoryGetInventoryItemsGetResult

executionOrder:
  - role: DeviceA
    block: pf-init
  - role: DeviceA
    block: test

cleanup:
  DeviceA:
    - command: PFServicesUninitializeAsync
    - command: XTaskQueueCloseHandle