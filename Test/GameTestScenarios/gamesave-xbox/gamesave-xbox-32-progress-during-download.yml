id: Scenario-Xbox-32-Progress-During-Download
name: GameSave Xbox 32 - Progress Query During Download
tags:
  - xboxgamesaves
  - failing
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Device B seeds 10 MB data and uploads. After a wait for background processing, Device A downloads with progress tracking enabled. Verify progress callback fires with monotonic state transitions and snapshot matches.
brief: Progress callback fires monotonically during large download
group: E. Progress, Cancel, Mid-Sync
devices:
  DeviceA:
    engine: [xbox, pc-grts]
    prerequisites:
      sandbox: "XDKS.1"
  DeviceB: {}
defaults:
  stepTimeoutSeconds: 300
blocks:
  session-b-seed-data:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: Retry
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/large.bin
            bytes: 10485760
            pattern: [0xAA]
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
      timeoutSeconds: 600
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  wait-for-background-upload:
    - command: SmokeDelay
      parameters:
        durationMs: 180000
  session-a-download-with-progress:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: Retry
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # Clear local data to force a full download
    - command: DeleteSaveRoot
    # Download begins; progress callback fires tracking download state transitions
    - command: PFGameSaveFilesAddUserWithUiAsync
      timeoutSeconds: 600
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceB
    block: session-b-seed-data
  - role: DeviceB
    block: wait-for-background-upload
  - role: DeviceA
    block: session-a-download-with-progress
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
