id: Scenario-Xbox-85-Upload-SyncFailed-Rate-Limit
name: GameSave Xbox 85 - Upload SyncFailed Rate Limit
tags:
  - xboxgamesaves
  - verified
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Rapidly upload to hit rate limits during UploadWithUiAsync (not AddUser). Verify SyncFailed callback fires during upload. Test Retry response (eventually succeeds) and Cancel response (returns error, local data intact).
brief: SyncFailed callback on upload rate limit
group: O. Rate Limiting / Upload Stress
devices:
  DeviceA:
    engine: [xbox, pc-grts]
    prerequisites:
      sandbox: "XDKS.1"
defaults:
  stepTimeoutSeconds: 240
blocks:
  init-session:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
  burn-rate-limit-retry:
    # Set SyncFailed auto-response to Retry — should eventually succeed after backoff
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: Retry
    # Rapid uploads with 2-second intervals to burn through rate limit
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save.dat
            bytes: 1024
            pattern: [0x01]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    - command: SmokeDelay
      parameters:
        durationMs: 2000
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save.dat
            bytes: 1024
            pattern: [0x02]
    - command: PFGameSaveFilesUploadWithUiAsync
