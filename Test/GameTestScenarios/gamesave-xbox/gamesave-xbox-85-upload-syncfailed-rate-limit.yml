    # Verify Retry auto-response handled SyncFailed — upload eventually succeeds
    - command: PFGameSaveFilesGetFolder
  reset-for-cancel-test:
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: false
    - command: SmokeDelay
      parameters:
        durationMs: 5000
  burn-rate-limit-cancel:
    # Set SyncFailed auto-response to Cancel — should return error HRESULT
    - command: PFGameSaveFilesSetUiSyncFailedAutoResponse
      parameters:
        enable: true
        action: Cancel
    # Rapid uploads with 2-second intervals to trigger SyncFailed during upload
