      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save.dat
            bytes: 1024
            pattern: [0x0A]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    - command: SmokeDelay
      parameters:
        durationMs: 2000
    - command: WriteGameSaveData
      parameters:
        operations:
