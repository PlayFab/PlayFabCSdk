id: Scenario-Xbox-30-Return-Online-No-Reinit
name: GameSave Xbox 30 - Return Online Without Re-Init
tags:
  - xboxgamesaves
  - failing
platforms:
  xbox: passing  # Restructured: tests network interruption recovery without reinit (22.9s)
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: >
  Restructured for Xbox CS: Initializes online, uploads data, then experiences a network
  interruption (DisableNetwork/EnableNetwork). After network returns, verifies that
  Xbox CS auto-recovers and operations resume without uninit/reinit.
  Tests that Xbox CS handles network blips transparently.
brief: Return online and sync without reinitializing
group: D. Sync Failure / Offline
devices:
  DeviceA:
    engine: [xbox]
    prerequisites:
      sandbox: "XDKS.1"
defaults:
  stepTimeoutSeconds: 180
blocks:
  session-a-init-and-upload:
    # Initialize online and upload baseline data
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: XUserAddAsync
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: KeepDeviceActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
  session-a-network-interrupt:
    # Network interruption — no device commands in batch (skip-batch path)
    - command: ChangeTargetDeviceState
      parameters:
        action: DisableNetwork
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
  session-a-verify-no-reinit:
    # After network returns — verify operations work WITHOUT reinit
    - command: SmokeDelay
      parameters:
        durationMs: 5000
    # NO uninit/reinit — just verify operations still work
    - command: PFGameSaveFilesGetFolder
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    # Clean teardown
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: session-a-init-and-upload
  - role: DeviceA
    block: session-a-network-interrupt
  - role: DeviceA
    block: session-a-verify-no-reinit
cleanup:
  DeviceA:
    - command: ChangeTargetDeviceState
      parameters:
        action: EnableNetwork
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle