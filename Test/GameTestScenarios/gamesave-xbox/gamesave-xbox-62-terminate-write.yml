id: Scenario-Xbox-62-Terminate-Write
name: GameSave Xbox 62 - Title Termination During Write
tags:
  - xboxgamesaves
  - failing
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Device A writes save data and is terminated before upload completes. Device A relaunches and verifies no corrupt state. After a GRTS background-upload wait, Device B verifies cloud state is coherent.
brief: Title termination during write no corrupt state
group: J. Title Termination / Eviction
devices:
  DeviceA:
    engine: [xbox, pc-grts]
    prerequisites:
      sandbox: "XDKS.1"
  DeviceB: {}
defaults:
  stepTimeoutSeconds: 240
blocks:
  session-a-write-and-terminate:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    # Terminate immediately after write, before upload can complete
    - command: ChangeTargetDeviceState
      parameters:
        action: Terminate
  session-a-relaunch-verify:
    - command: ChangeTargetDeviceState
      parameters:
        action: Relaunch
    - command: SmokeDelay
      parameters:
        durationMs: 15000
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Snapshot local state — data may or may not have persisted
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  wait-for-background-upload:
    # Wait 3 minutes for GRTS background upload (if data persisted locally)
    - command: SmokeDelay
      parameters:
        durationMs: 180000
  session-b-verify:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Snapshot cloud state — should be coherent (data present or cleanly empty)
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: session-a-write-and-terminate
  - role: DeviceA
    block: session-a-relaunch-verify
  - role: DeviceA
    block: wait-for-background-upload
  - role: DeviceB
    block: session-b-verify
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
