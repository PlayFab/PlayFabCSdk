id: Scenario-Xbox-17-Conflict-Stock-TCUI
name: GameSave Xbox 17 - Stock TCUI Conflict Resolution
tags:
  - xboxgamesaves
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: >
  Single-device test. Upload data A to cloud, then write divergent local data B
  without uploading (creates local≠cloud mismatch). Relaunch in stock TCUI mode
  (no custom callbacks). AddUser detects conflict and auto-responds UseLocal.
  Verify local data B persists after conflict resolution.
brief: Conflict resolution using stock TCUI mode
group: C. Conflict Resolution
devices:
  DeviceA:
    engine: [xbox]
    prerequisites:
      sandbox: "XDKS.1"
defaults:
  stepTimeoutSeconds: 240
blocks:
  session-a-seed-cloud:
    # Upload baseline data A to cloud, then release device
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: CleanSaveFolder
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0xAA, 0xBB, 0xCC, 0xDD]
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  session-a-create-divergent-local:
    # Reinit, add user (syncs baseline A), then write divergent data B locally.
    # Do NOT upload — this leaves local=B, cloud=A.
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    # Overwrite with divergent data B — do NOT upload
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/payload.bin
            bytes: 10240
            pattern: [0x11, 0x22, 0x33, 0x44]
    # Release device WITHOUT uploading — local stays at B, cloud stays at A
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  session-a-stock-tcui-conflict:
    # Relaunch in stock TCUI mode (no custom callbacks).
    # AddUser detects local (B) ≠ cloud (A) → conflict → auto-respond UseLocal.
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    # Intentionally NOT calling PFGameSaveFilesSetUiCallbacks — stock TCUI mode
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiSyncConflictAutoResponse
      parameters:
        enable: true
        action: UseLocal
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # AddUser triggers conflict: local B ≠ cloud A → stock TCUI auto-responds UseLocal
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
executionOrder:
  - role: DeviceA
    block: session-a-seed-cloud
  - role: DeviceA
    block: session-a-create-divergent-local
  - role: DeviceA
    block: session-a-stock-tcui-conflict
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle