id: Scenario-Xbox-81-Multi-File-Sync
name: GameSave Xbox 81 - Multi-File Sync Across Devices
tags:
  - xboxgamesaves
  - verified
platforms:
  xbox: passing
  pc-grts: ignore
  pc-inproc-gamesaves: ignore
  psx: ignore
description: Device A creates multiple save files across folders, uploads. Device B syncs and verifies all files present. Device B modifies one file, uploads. Device A re-syncs and confirms the modification.
brief: Multi-file sync and modify across devices
group: N. Multi-File / Large Data / Network
devices:
  DeviceA:
    engine: [xbox, pc-grts]
    prerequisites:
      sandbox: "XDKS.1"
  DeviceB: {}
defaults:
  stepTimeoutSeconds: 240
blocks:
  session-a-create-multi-file:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: DeleteSaveRoot
    # Create multiple save files across different folders
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save1.bin
            bytes: 10240
            pattern: [0xAA]
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save2.bin
            bytes: 20480
            pattern: [0xBB]
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: settings/config.bin
            bytes: 4096
            pattern: [0xCC]
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: achievements/stats.bin
            bytes: 8192
            pattern: [0xDD]
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  wait-for-grts:
    - command: SmokeDelay
      parameters:
        durationMs: 180000
  session-b-sync-and-modify:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    - command: DeleteSaveRoot
    # Download all files from cloud
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    # Verify all 4 files present and matching
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
    # Modify one file and re-upload
    - command: WriteGameSaveData
      parameters:
        operations:
          - verb: CreateBinaryFile
            relativePath: progress/save1.bin
            bytes: 10240
            pattern: [0xEE]
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: left
    - command: PFGameSaveFilesUploadWithUiAsync
      parameters:
        mode: ReleaseDeviceAsActive
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  session-a-verify-modification:
    - command: XGameRuntimeInitialize
    - command: PFInitialize
    - command: PFServicesInitialize
    - command: PFServiceConfigCreateHandle
      parameters:
        endpoint: "https://E18D7.playfabapi.com"
        titleId: "E18D7"
    - command: XTaskQueueCreate
      parameters:
        workMode: ThreadPool
        completionMode: ThreadPool
        setAsProcessQueue: true
    - command: PFGameSaveFilesInitialize
      parameters:
        saveFolder: "C:\\gamesaves-test\\"
    - command: PFGameSaveFilesSetUiCallbacks
      parameters:
        enable: true
    - command: PFGameSaveFilesSetActiveDeviceChangedCallback
    - command: PFGameSaveFilesSetUiActiveDeviceContentionAutoResponse
      parameters:
        enable: true
        action: SyncLastSavedData
    - command: PFGameSaveFilesSetUiConflictAutoResponse
      parameters:
        enable: true
        action: UseCloud
    - command: XUserAddAsync
    - command: PFAuthenticationLoginWithCustomIDAsync
      parameters:
        customId: "GameTestHarness"
        createAccount: true
    - command: PFAccountManagementClientLinkXboxAccountAsync
      parameters:
        forceLink: true
        unlinkIfNeeded: true
    - command: PFLocalUserCreateHandleWithXboxUser
    # Re-sync — stale local data should be overwritten
    - command: PFGameSaveFilesAddUserWithUiAsync
    - command: PFGameSaveFilesGetFolder
    - command: CaptureSaveContainerSnapshot
      parameters:
        slot: right
    # Verify save1.bin updated (pattern 0xEE), other files unchanged
    - command: CompareSaveContainerSnapshots
      parameters:
        ignoreTimestamps: true
    - command: DeleteSaveRoot
      parameters:
        preserveManifest: false
executionOrder:
  - role: DeviceA
    block: session-a-create-multi-file
  - role: DeviceA
    block: wait-for-grts
  - role: DeviceB
    block: session-b-sync-and-modify
  - role: DeviceB
    block: wait-for-grts
  - role: DeviceA
    block: session-a-verify-modification
cleanup:
  DeviceA:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle
  DeviceB:
    - command: PFLocalUserCloseHandle
    - command: XUserCloseHandle
    - command: PFGameSaveFilesUninitializeAsync
    - command: PFServicesUninitializeAsync
    - command: PFUninitializeAsync
    - command: PFServiceConfigCloseHandle
    - command: XTaskQueueCloseHandle

